<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFS — Yapım aşamasında</title>
    <meta name="description" content="OFS Dış Ticaret Ltd. Şti. web sitesi yenileniyor. Kısa süre içinde yeniden yayında olacağız.">
    <meta name="robots" content="noindex">

    <!-- www -> apex (path'i kaybetmeden) -->
    <script>
      if (window.location.hostname === 'www.ofsenterprise.com') {
        window.location.replace('https://ofsenterprise.com' + window.location.pathname + window.location.search + window.location.hash);
      }
    </script>

    <meta property="og:title" content="OFS — Yapım aşamasında">
    <meta property="og:description" content="Web sitemiz yenileniyor. Kısa süre içinde yeniden yayında olacağız.">
    <meta property="og:url" content="https://ofsenterprise.com/">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      :root { --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --accent: #047857; --accent-soft: #ecfdf5; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: var(--ink); background: #fff; -webkit-font-smoothing: antialiased;
        display: flex; flex-direction: column; min-height: 100%;
        background-image:
          radial-gradient(ellipse 60% 45% at 50% -10%, rgba(4, 120, 87, .10), transparent 70%),
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: auto, 56px 56px, 56px 56px;
        background-position: center top, center top, center top;
      }
      body::before { /* ızgarayı kenarlara doğru soldur */
        content: ""; position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 75% 65% at 50% 35%, rgba(255,255,255,.55) 0%, #fff 78%);
      }
      header, main, footer { position: relative; z-index: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: 0 24px; }
      header { padding-top: 32px; display: flex; align-items: center; justify-content: center; gap: 12px; }
      header img { width: 40px; height: 40px; }
      header span { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }

      main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-top: 48px; padding-bottom: 48px; }
      .pill {
        display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; margin-bottom: 28px;
        font-size: 13px; font-weight: 600; color: #065f46; background: var(--accent-soft);
        border: 1px solid #d1fae5; border-radius: 999px;
      }
      .dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
      .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--accent); animation: ping 1.8s cubic-bezier(0, 0, .2, 1) infinite; }
      @keyframes ping { 75%, 100% { transform: scale(2.6); opacity: 0; } }

      h1 { font-size: clamp(34px, 6.2vw, 56px); line-height: 1.08; font-weight: 800; letter-spacing: -.03em; margin-bottom: 20px; }
      .lead { font-size: clamp(17px, 2.2vw, 20px); line-height: 1.6; color: var(--muted); max-width: 520px; }
      .en { margin-top: 14px; font-size: 15px; line-height: 1.6; color: #9ca3af; max-width: 520px; }

      .bar { width: min(280px, 70%); height: 4px; margin: 40px 0; border-radius: 999px; background: var(--line); overflow: hidden; }
      .bar i { display: block; width: 40%; height: 100%; border-radius: 999px; background: var(--accent); animation: slide 2.4s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }

      .btn {
        display: inline-flex; align-items: center; gap: 10px; padding: 13px 22px; font-size: 15px; font-weight: 600;
        color: #fff; background: var(--accent); border-radius: 10px; text-decoration: none; transition: background .2s, transform .2s;
      }
      .btn:hover { background: #065f46; transform: translateY(-1px); }
      .btn svg { width: 18px; height: 18px; }

      footer { padding-top: 20px; padding-bottom: 28px; text-align: center; font-size: 13px; color: #9ca3af; border-top: 1px solid var(--line); max-width: none; background: rgba(255,255,255,.7); }

      @media (prefers-reduced-motion: reduce) { .dot::after, .bar i { animation: none; } .bar i { width: 60%; } }
    </style>
</head>
<body>

    <header>
        <img src="images/ofs-logo.png" width="40" height="40" alt="OFS logosu">
        <span>OFS</span>
    </header>

    <main>
        <div class="pill"><span class="dot"></span>Yapım aşamasında</div>
        <h1>Web sitemiz yenileniyor.</h1>
        <p class="lead">Yeni sitemiz üzerinde çalışıyoruz. Kısa süre içinde yeniden yayında olacağız.</p>
        <p class="en" lang="en">Our website is being rebuilt. We will be back online soon.</p>

        <div class="bar" aria-hidden="true"><i></i></div>

        <a class="btn" href="mailto:furkan@ofsenterprise.com">
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg>
            furkan@ofsenterprise.com
        </a>
    </main>

    <footer>
        © <script>document.write(new Date().getFullYear())</script> OFS Dış Ticaret Ltd. Şti. · İstanbul, Türkiye
    </footer>

</body>
</html>
